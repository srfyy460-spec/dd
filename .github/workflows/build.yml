name: Update Discount Hashes

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate Hashes and Inject
        id: generate
        run: |
          RAW_SECRET="${{ secrets.TAKHFIF }}"
          
          if [ -z "$RAW_SECRET" ]; then
            JSON_ARRAY="[]"
          else
            # استفاده از پایتون برای پردازش و تولید JSON (هش + درصد)
            JSON_ARRAY=$(python3 -c "
          import hashlib, json, sys
          raw_text = '''$RAW_SECRET'''
          lines = raw_text.strip().split('\n')
          result = []
          for line in lines:
              parts = line.split(';')
              if len(parts) >= 3:
                  code = parts[1].strip()
                  percent = parts[2].strip()
                  if code and percent:
                      hashed = hashlib.sha256(code.encode('utf-8')).hexdigest()
                      result.append({'hash': hashed, 'percent': int(percent)})
          print(json.dumps(result))
          ")
          fi
          
          echo "Generated hashes: $JSON_ARRAY"
          
          # جایگزینی در فایل HTML
          sed -i "s|DISCOUNT_HASHES_PLACEHOLDER|$JSON_ARRAY|g" index.html

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Update discount hashes automatically" || echo "No changes to commit"
          git push
